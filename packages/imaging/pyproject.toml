[project]
name = "emulsion-imaging"
version = "0.1.0"
description = "Crop, align, colour-match, score and composite. Pure arrays, no web."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulsion_imaging"]

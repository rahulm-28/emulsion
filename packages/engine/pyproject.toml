[project]
name = "emulsion-engine"
version = "0.1.0"
description = "The layer between the user and the model. Pure Python, no web imports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "emulsion-providers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulsion_engine"]

[tool.uv.sources]
emulsion-providers = { workspace = true }

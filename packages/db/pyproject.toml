[project]
name = "emulsion-db"
version = "0.1.0"
description = "SQLAlchemy models, session factory, and the DB-backed queue."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "emulsion-platform",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulsion_db"]

[tool.uv.sources]
emulsion-platform = { workspace = true }

[project]
name = "emulsion-api"
version = "0.1.0"
description = "FastAPI surface. Thin: it creates jobs and reports on them."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "emulsion-db",
    "emulsion-platform",
    "emulsion-providers",
    "emulsion-worker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emulsion_api"]

[tool.uv.sources]
emulsion-db = { workspace = true }
emulsion-platform = { workspace = true }
emulsion-providers = { workspace = true }
emulsion-worker = { workspace = true }
